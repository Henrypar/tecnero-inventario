name: tecnero_inventario
description: Sistema de gestión de inventarios y costos de producción - TECNERO

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # API HTTP hacia backend NestJS
  http: ^1.2.1
  
  # State management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^13.2.0

  # Realtime notifications
  socket_io_client: ^2.0.3+1
  audioplayers: ^6.1.0
  
  # UI
  google_fonts: ^8.1.0
  fl_chart: ^0.67.0
  shimmer: ^3.0.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  
  # Export
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/
